name: Build and publish to AUR

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: Republish the latest stable release even when its version is already on the AUR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aur-publish-arknights-launcher-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check for a stable release to publish
        id: release
        if: >-
          github.repository == 'ParticleG/arknights-launcher' &&
          ((github.event_name == 'release' && !github.event.release.prerelease) ||
           (github.ref == 'refs/heads/main' &&
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish && 'true' || 'false' }}
        shell: bash
        run: |
          version=$(bash scripts/check-aur-release.sh "$FORCE_PUBLISH")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate package
        id: build
        if: >-
          steps.release.outputs.version != '' ||
          (github.event_name != 'schedule' && github.event_name != 'release')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          dir="$RUNNER_TEMP/arch-package"
          mkdir -p -- "$dir"
          if [[ -n $RELEASE_VERSION ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$RELEASE_VERSION" --jq '.sha')
            [[ $commit =~ ^[0-9a-f]{40}$ ]]
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --output "$dir/arknights-launcher-$commit.tar.gz" \
              "https://github.com/$GITHUB_REPOSITORY/archive/$commit.tar.gz"
            python3 scripts/prepare-aur.py "$commit" "$dir" --release-version "$RELEASE_VERSION"
          else
            commit=$(git rev-parse HEAD)
            git archive --format=tar.gz --prefix="arknights-launcher-$commit/" \
              --output="$dir/arknights-launcher-$commit.tar.gz" "$commit"
            python3 scripts/prepare-aur.py "$commit" "$dir"
          fi

          docker run --rm --env BUILD_UID="$(id -u)" --volume "$dir:/pkg" --workdir /pkg \
            archlinux:base-devel bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
              mapfile -t deps < <(awk '\''$1 == "depends" || $1 == "makedepends" { print $3 }'\'' .SRCINFO)
              pacman -Syu --needed --noconfirm desktop-file-utils "${deps[@]}"
              runuser -u builder -- makepkg --cleanbuild --noconfirm
              smoke_dir=$(mktemp -d)
              bsdtar -xf ./*.pkg.tar.zst -C "$smoke_dir"
              desktop-file-validate "$smoke_dir/usr/share/applications/arknights-launcher.desktop"
              test -s "$smoke_dir/usr/share/icons/hicolor/256x256/apps/arknights-launcher.png"
              test -s "$smoke_dir/usr/share/licenses/arknights-launcher/LICENSE"
              test -s "$smoke_dir/usr/share/licenses/arknights-launcher/LLauncher-MIT.txt"
              libs=$(ldd "$smoke_dir/usr/bin/arknights-launcher")
              if [[ "$libs" == *"not found"* ]]; then
                printf "%s\n" "$libs" >&2
                exit 1
              fi
            '
          artifact_dir="$RUNNER_TEMP/arch-artifact"
          mkdir -p -- "$artifact_dir"
          cp -- "$dir"/*.pkg.tar.zst "$artifact_dir/"
          if [[ -n $RELEASE_VERSION ]]; then
            cp -- "$dir"/{PKGBUILD,.SRCINFO,arknights-launcher.desktop} "$artifact_dir/"
          fi
          printf 'artifact=arknights-launcher-arch-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload validated Arch package and recipe
        if: steps.build.outputs.artifact != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/arch-artifact/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish verified package recipe
    needs: build
    if: needs.build.outputs.version != '' && needs.build.outputs.artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified recipe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: arknights-launcher
          pkgbuild: ./PKGBUILD
          assets: arknights-launcher.desktop
          commit_username: ParticleG
          commit_email: particle_g@outlook.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'Update to ${{ needs.build.outputs.version }}-1'
